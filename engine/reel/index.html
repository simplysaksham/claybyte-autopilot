<!doctype html>
<html><head><meta charset="utf-8">
<style>

html,body{margin:0;width:720px;height:1280px;overflow:hidden;background:#000}

canvas{display:block;width:720px;height:1280px}

#banner{position:absolute;top:112px;left:50%;transform:translateX(-50%);max-width:640px;text-align:center;
  background:#F6EBD3;color:#2A1F33;font:800 31px/1.1 Brico,sans-serif;letter-spacing:.5px;
  padding:16px 30px 14px;box-shadow:0 6px 0 rgba(0,0,0,.18);white-space:nowrap;

#caps{position:absolute;left:0;right:0;bottom:250px;display:flex;justify-content:center;gap:12px}
.w{background:#E8664A;color:#FFF6E3;font:700 46px/1 Fraunces;padding:10px 16px 14px;box-shadow:0 5px 0 rgba(0,0,0,.22);border-radius:3px}
.w.k{background:#F2B33D;color:#2A1F33}
#ovl{position:absolute;inset:0}
.chip{position:absolute;background:#FFF6E3;color:#2A1F33;font:800 30px/1 Brico;padding:12px 18px;border-radius:12px;box-shadow:0 6px 0 rgba(0,0,0,.2);white-space:nowrap}
.chip i{display:inline-block;width:18px;height:18px;border-radius:50%;margin-right:10px;vertical-align:-1px}
.counter{position:absolute;top:196px;right:48px;background:#2A1F33;color:#F6EBD3;border-radius:14px;padding:10px 18px;font:800 22px/1 Brico;display:flex;gap:12px;align-items:center;box-shadow:0 5px 0 rgba(0,0,0,.25)}
.counter b{font:900 44px/1 Fraunces;color:#F2B33D}
.big{position:absolute;left:0;right:0;top:220px;text-align:center}
.big b{display:inline-block;font:900 132px/1 Fraunces;color:#F2B33D;background:#2A1F33;padding:18px 34px 24px;border-radius:28px;box-shadow:0 10px 0 rgba(0,0,0,.25)}
.big span{display:block;font:800 30px Brico;color:#2A1F33;background:#F6EBD3;margin:14px auto 0;width:max-content;padding:8px 18px;border-radius:10px}
.card{position:absolute;left:70px;right:70px;top:230px;background:#FFF9EC;border-radius:22px;padding:26px 30px;box-shadow:0 10px 0 rgba(0,0,0,.22);color:#2A1F33}

.term{position:absolute;left:56px;right:56px;top:220px;background:#221A2C;border-radius:20px;padding:22px 24px;box-shadow:0 10px 0 rgba(0,0,0,.3);font:600 25px/1.35 "DejaVu Sans Mono",monospace;color:#F6EBD3}

.score{position:absolute;left:50%;top:230px;transform:translateX(-50%);background:#3FAE6A;color:#fff;font:900 96px/1 Fraunces;padding:20px 40px;border-radius:30px;box-shadow:0 10px 0 rgba(0,0,0,.25)}
.score.bad{background:#E5484D}

.chk p i.on{background:#3FAE6A;border-color:#3FAE6A}
.ba{position:absolute;left:60px;right:60px;top:215px;display:flex;flex-direction:column;align-items:stretch}
.ba>div:not(.arr){border-radius:22px;padding:18px 26px 20px;box-shadow:0 9px 0 rgba(0,0,0,.24);position:relative}
.ba span{display:inline-block;font:800 21px Brico;letter-spacing:3px;padding:5px 12px;border-radius:8px;margin-bottom:8px}
.ba p{margin:0;font:800 33px/1.18 Brico}
.ba .bef{background:#F6EBD3;color:#2A1F33}.ba .bef span{background:#E5484D;color:#fff}
.ba .bef .x{position:absolute;left:18px;right:18px;top:50%;height:6px;background:#E5484D;border-radius:3px;transform:rotate(-4deg)}
.ba .aft{background:#2A1F33;color:#FFF6E3;outline:5px solid #3FAE6A}.ba .aft span{background:#3FAE6A;color:#fff}
.ba .arr{text-align:center;font:900 54px/1 Brico;color:#FFF6E3;text-shadow:0 4px 0 rgba(0,0,0,.3);margin:6px 0}
.send{position:absolute;left:56px;right:56px;top:220px;background:#FFF9EC;border-radius:26px;padding:22px 24px 24px;box-shadow:0 10px 0 rgba(0,0,0,.24);color:#2A1F33}
.send .hd{display:flex;align-items:center;gap:14px;font:900 40px/1 Fraunces;margin-bottom:18px}.send svg{width:44px;height:44px}
.send .to{display:flex;align-items:center;gap:16px;background:#fff;border-radius:18px;padding:14px 16px;box-shadow:inset 0 0 0 3px #EADBC0}
.send .to i{flex:none;width:58px;height:58px;border-radius:50%;background:#B6A2E3}
.send .to b{font:800 27px/1.2 Brico;flex:1}
.send .to u{text-decoration:none;flex:none;color:#fff;font:800 26px Brico;padding:10px 18px;border-radius:12px}
.send p{margin:16px 4px 0;font:700 26px/1.25 Brico;color:#5b4f66}
#dim{background:rgba(28,18,40,0)}
.cbox{position:absolute;left:60px;right:60px;top:610px;background:#FFF6E3;border-radius:60px;height:104px;display:flex;align-items:center;padding:0 22px;box-shadow:0 10px 0 rgba(0,0,0,.25);font:600 40px Brico;color:#2A1F33}
.cbox .av{width:62px;height:62px;border-radius:50%;background:#36B5A0;margin-right:20px;flex:none;position:relative}
.cbox .av:before,.cbox .av:after{content:"";position:absolute;top:22px;width:12px;height:16px;background:#1d1424;border-radius:6px}
.cbox .av:before{left:17px}.cbox .av:after{right:17px}
.cbox .ph{color:#9a8ea3}.cbox .cur{display:inline-block;width:4px;height:44px;background:#E8664A;margin-left:4px;vertical-align:-8px}
.cbox .post{margin-left:auto;font:800 34px Brico;color:#E8664A}
.env{position:absolute;left:50%;top:330px;width:220px;height:160px;margin-left:-110px;background:#FFF6E3;border-radius:16px;box-shadow:0 10px 0 rgba(0,0,0,.25)}
.env:before{content:"";position:absolute;left:0;right:0;top:0;height:100px;background:linear-gradient(to bottom right,transparent 49.5%,#EADBC0 50%) left/50% 100% no-repeat,linear-gradient(to bottom left,transparent 49.5%,#EADBC0 50%) right/50% 100% no-repeat}
.env .bd{position:absolute;right:-22px;top:-22px;width:64px;height:64px;border-radius:50%;background:#E8664A;color:#fff;font:900 36px/64px Fraunces;text-align:center}
.follow{position:absolute;left:0;right:0;top:770px;text-align:center;font:800 34px Brico;color:#FFF6E3}
.follow span{background:#2A1F33;padding:12px 22px;border-radius:12px}
#brand{position:absolute;bottom:60px;left:0;right:0;text-align:center;font:800 24px Brico;color:rgba(255,246,227,.75);letter-spacing:3px}
